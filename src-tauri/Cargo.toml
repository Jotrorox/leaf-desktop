[package]
name = "leaf-desktop"
description = "leaf desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (https://github.com/rust-lang/cargo/issues/8519).
# staticlib/cdylib are needed for Tauri mobile (iOS/Android) later.
name = "leaf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-window-state.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance.workspace = true

[lints]
workspace = true

# The release profile lives in the workspace root Cargo.toml.
