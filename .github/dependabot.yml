version: 2

# Note: Dependabot cannot update mise.toml (node, pnpm, actionlint, shellcheck)
# or rust-toolchain.toml; bump those by hand.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      frontend-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
